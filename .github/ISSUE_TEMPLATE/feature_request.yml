name: 機能要望
description: 新機能・既存機能の改善を提案する
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        背景と目的が明確だと検討しやすくなります。

  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: どのような機能・改善を提案するかを簡潔に説明してください。
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: 背景・目的
      description: なぜこの機能が必要か、どの課題を解決するかを記載してください。
      placeholder: 例）現状は〜のため〜が不便。これを〜できるようにしたい。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提案内容（案）
      description: 想定している実装・UI・挙動などがあれば記載してください。
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 代替案・検討事項
      description: 他に考えられる方法や、検討すべきトレードオフがあれば記載してください。
    validations:
      required: false
