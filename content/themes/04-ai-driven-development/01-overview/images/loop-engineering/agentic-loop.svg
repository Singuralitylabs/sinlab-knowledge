<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title-loop">
  <title id="title-loop">エージェンティックループ：コンテキスト収集 → 行動 → 検証 → 繰り返し（または完了）</title>
  <defs>
    <marker id="loop-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#4f46e5" stroke-width="1.5"/>
    </marker>
    <marker id="loop-arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#059669" stroke-width="1.5"/>
    </marker>
  </defs>
  <style>
    .box { font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; font-weight: 700; fill: #312e81; }
    .sub { font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; fill: #4b5563; }
    .cap { font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; fill: #4b5563; }
    .done { font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; font-weight: 700; fill: #065f46; }
    .again { font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; font-weight: 700; fill: #4f46e5; }
  </style>

  <!-- step 1 -->
  <rect x="40" y="150" width="160" height="88" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/>
  <text class="box" x="120" y="186" font-size="16" text-anchor="middle">1. コンテキスト収集</text>
  <text class="sub" x="120" y="212" font-size="13" text-anchor="middle">ファイル・ログ・仕様</text>

  <!-- step 2 -->
  <rect x="280" y="150" width="160" height="88" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/>
  <text class="box" x="360" y="186" font-size="16" text-anchor="middle">2. 行動</text>
  <text class="sub" x="360" y="212" font-size="13" text-anchor="middle">編集・コマンド実行</text>

  <!-- step 3 -->
  <rect x="520" y="150" width="160" height="88" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/>
  <text class="box" x="600" y="186" font-size="16" text-anchor="middle">3. 検証</text>
  <text class="sub" x="600" y="212" font-size="13" text-anchor="middle">テスト・lint・ビルド</text>

  <!-- forward arrows -->
  <line x1="200" y1="194" x2="272" y2="194" stroke="#4f46e5" stroke-width="2" marker-end="url(#loop-arrow)"/>
  <line x1="440" y1="194" x2="512" y2="194" stroke="#4f46e5" stroke-width="2" marker-end="url(#loop-arrow)"/>

  <!-- done exit -->
  <rect x="540" y="40" width="120" height="48" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
  <text class="done" x="600" y="70" font-size="16" text-anchor="middle">完了</text>
  <path d="M600,150 L600,98" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#loop-arrow-green)"/>
  <text class="sub" x="548" y="128" font-size="12" text-anchor="end">条件を満たす</text>

  <!-- repeat arc -->
  <path d="M600,238 C600,330 120,330 120,238" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#loop-arrow)"/>
  <text class="again" x="360" y="318" font-size="15" text-anchor="middle">未達なら繰り返す</text>

  <text class="cap" x="360" y="392" font-size="15" text-anchor="middle">エージェンティックループ — 環境からのフィードバックで次の一手を決める</text>
</svg>
