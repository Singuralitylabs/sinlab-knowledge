<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="title-styles">
  <title id="title-styles">チャット型 AI・スケジュール実行・常駐型 AI アシスタントの違い：作業を始めるのは誰か</title>
  <style>
    .h { font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; font-weight: 700; fill: #312e81; }
    .t { font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; fill: #374151; }
    .s { font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; fill: #6b7280; }
    .k { font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; font-weight: 700; fill: #ffffff; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/>
    </marker>
  </defs>

  <!-- column 1: chat -->
  <rect x="20" y="20" width="270" height="320" rx="14" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text class="h" x="155" y="56" font-size="19" text-anchor="middle">チャット型 AI</text>
  <rect x="85" y="78" width="140" height="30" rx="15" fill="#4f46e5"/>
  <text class="k" x="155" y="98" font-size="14" text-anchor="middle">起点：人の質問</text>
  <rect x="50" y="135" width="100" height="44" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
  <text class="t" x="100" y="162" font-size="15" text-anchor="middle">👤 人</text>
  <rect x="170" y="135" width="100" height="44" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
  <text class="t" x="220" y="162" font-size="15" text-anchor="middle">🤖 AI</text>
  <line x1="150" y1="150" x2="168" y2="150" stroke="#6366f1" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="170" y1="166" x2="152" y2="166" stroke="#6366f1" stroke-width="2" marker-end="url(#arr)"/>
  <text class="t" x="155" y="218" font-size="14" text-anchor="middle">聞いたときだけ答える</text>
  <text class="t" x="155" y="242" font-size="14" text-anchor="middle">会話が終われば止まる</text>
  <text class="s" x="155" y="300" font-size="13" text-anchor="middle">たとえるなら</text>
  <text class="h" x="155" y="322" font-size="15" text-anchor="middle">物知りな人</text>

  <!-- column 2: scheduled -->
  <rect x="315" y="20" width="270" height="320" rx="14" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text class="h" x="450" y="56" font-size="19" text-anchor="middle">スケジュール実行</text>
  <rect x="365" y="78" width="170" height="30" rx="15" fill="#4f46e5"/>
  <text class="k" x="450" y="98" font-size="14" text-anchor="middle">起点：人が決めた時刻</text>
  <circle cx="450" cy="157" r="26" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
  <line x1="450" y1="157" x2="450" y2="140" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="450" y1="157" x2="463" y2="157" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round"/>
  <text class="t" x="450" y="218" font-size="14" text-anchor="middle">決めた時刻に</text>
  <text class="t" x="450" y="242" font-size="14" text-anchor="middle">決めた仕事だけをする</text>
  <text class="s" x="450" y="300" font-size="13" text-anchor="middle">たとえるなら</text>
  <text class="h" x="450" y="322" font-size="15" text-anchor="middle">当番</text>

  <!-- column 3: always-on -->
  <rect x="610" y="20" width="270" height="320" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text class="h" x="745" y="56" font-size="19" text-anchor="middle">常駐型 AI アシスタント</text>
  <rect x="650" y="78" width="190" height="30" rx="15" fill="#4f46e5"/>
  <text class="k" x="745" y="98" font-size="14" text-anchor="middle">起点：AI 自身の判断</text>
  <rect x="645" y="128" width="200" height="58" rx="8" fill="#ffffff" stroke="#6366f1"/>
  <text class="t" x="745" y="151" font-size="14" text-anchor="middle">🤖 アプリを見張り続ける</text>
  <text class="t" x="745" y="174" font-size="14" text-anchor="middle">→「これ、対応しますか？」</text>
  <text class="t" x="745" y="218" font-size="14" text-anchor="middle">頼まれる前に動き、</text>
  <text class="t" x="745" y="242" font-size="14" text-anchor="middle">重要な操作だけ承認を求める</text>
  <text class="s" x="745" y="300" font-size="13" text-anchor="middle">たとえるなら</text>
  <text class="h" x="745" y="322" font-size="15" text-anchor="middle">そばにいる秘書</text>

  <text class="s" x="450" y="380" font-size="14" text-anchor="middle">違いは「誰が作業を始めるか」— 人 → 人が決めた時刻 → AI 自身</text>
</svg>
