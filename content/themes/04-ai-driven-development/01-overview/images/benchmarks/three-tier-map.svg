<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="title-three-tier">
  <title id="title-three-tier">指標の3段の地図：総合・集約指標から能力カテゴリ、個別ベンチマークへと絞り込む</title>
  <defs>
    <marker id="arrow-down" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1,1 L5,9 L9,1" fill="none" stroke="#6366f1" stroke-width="1.6"/>
    </marker>
  </defs>
  <style>
    .lvl { font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; font-weight: 700; fill: #312e81; }
    .sub { font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; fill: #4b5563; }
    .side { font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; fill: #6366f1; font-weight: 600; }
  </style>

  <!-- Tier 1 -->
  <polygon points="70,40 690,40 610,150 150,150" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
  <text class="lvl" x="380" y="86" font-size="20" text-anchor="middle">① 総合・集約指標</text>
  <text class="sub" x="380" y="116" font-size="14" text-anchor="middle">Intelligence Index・LMArena ／ 全体感をつかむ</text>

  <!-- Tier 2 -->
  <polygon points="150,162 610,162 530,272 230,272" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="1.5"/>
  <text class="lvl" x="380" y="206" font-size="20" text-anchor="middle">② 能力カテゴリ</text>
  <text class="sub" x="380" y="236" font-size="13" text-anchor="middle">知識・推論・コーディング・エージェント</text>

  <!-- Tier 3 -->
  <polygon points="230,284 530,284 450,394 310,394" fill="#c7d2fe" stroke="#a5b4fc" stroke-width="1.5"/>
  <text class="lvl" x="380" y="328" font-size="19" text-anchor="middle">③ 個別ベンチマーク</text>
  <text class="sub" x="380" y="356" font-size="13" text-anchor="middle">SWE-bench・GPQA ／ 裏取り</text>

  <!-- Side arrow: narrow down -->
  <line x1="715" y1="55" x2="715" y2="390" stroke="#6366f1" stroke-width="1.6" marker-end="url(#arrow-down)"/>
  <text class="side" x="742" y="225" font-size="14" text-anchor="middle" transform="rotate(90 742 225)">上から下へ絞り込む</text>
</svg>
