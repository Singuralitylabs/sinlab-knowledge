<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-labelledby="title-session-lifecycle">
  <title id="title-session-lifecycle">クラウドセッションの流れ：VM の用意とクローン、セットアップスクリプト（Claude 起動前・キャッシュされる）、SessionStart フック（開始・再開のたびに実行）、Claude の作業、commit と push。アイドルが続くと VM は回収され、再開すると新しい VM で会話履歴だけが復元される</title>
  <defs>
    <marker id="sl-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#4f46e5" stroke-width="1.5"/>
    </marker>
    <marker id="sl-arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#6b7280" stroke-width="1.5"/>
    </marker>
  </defs>
  <style>
    .num { font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; font-weight: 700; fill: #ffffff; }
    .box { font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; font-weight: 700; fill: #1f2937; }
    .sub { font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; fill: #4b5563; }
    .amber { font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; font-weight: 700; fill: #92400e; }
    .indigo { font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; font-weight: 700; fill: #3730a3; }
    .good { font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; font-weight: 700; fill: #065f46; }
    .bad { font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; font-weight: 700; fill: #991b1b; }
    .gray { font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; font-weight: 700; fill: #374151; }
  </style>

  <rect x="0" y="0" width="800" height="440" fill="#ffffff"/>

  <!-- ① VM -->
  <rect x="20" y="40" width="136" height="150" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.6"/>
  <circle cx="44" cy="66" r="12" fill="#6b7280"/>
  <text class="num" x="44" y="71" font-size="14" text-anchor="middle">1</text>
  <text class="box" x="62" y="71" font-size="14">VM を用意</text>
  <text class="sub" x="88" y="106" font-size="12" text-anchor="middle">Ubuntu 24.04 を起動</text>
  <text class="sub" x="88" y="124" font-size="12" text-anchor="middle">リポジトリを</text>
  <text class="sub" x="88" y="142" font-size="12" text-anchor="middle">クローン</text>

  <!-- ② setup script -->
  <rect x="176" y="40" width="136" height="150" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
  <circle cx="200" cy="66" r="12" fill="#d97706"/>
  <text class="num" x="200" y="71" font-size="14" text-anchor="middle">2</text>
  <text class="amber" x="218" y="64" font-size="13">セットアップ</text>
  <text class="amber" x="218" y="80" font-size="13">スクリプト</text>
  <text class="sub" x="244" y="106" font-size="12" text-anchor="middle">Claude 起動前・root</text>
  <text class="sub" x="244" y="124" font-size="12" text-anchor="middle">約 5 分以内なら</text>
  <text class="sub" x="244" y="142" font-size="12" text-anchor="middle">約 7 日キャッシュ</text>
  <text class="amber" x="244" y="176" font-size="11" text-anchor="middle">設定：環境ダイアログ</text>

  <!-- ③ SessionStart hook -->
  <rect x="332" y="40" width="136" height="150" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
  <circle cx="356" cy="66" r="12" fill="#4f46e5"/>
  <text class="num" x="356" y="71" font-size="14" text-anchor="middle">3</text>
  <text class="indigo" x="374" y="64" font-size="13">SessionStart</text>
  <text class="indigo" x="374" y="80" font-size="13">フック</text>
  <text class="sub" x="400" y="106" font-size="12" text-anchor="middle">Claude 起動後</text>
  <text class="sub" x="400" y="124" font-size="12" text-anchor="middle">開始・再開のたびに</text>
  <text class="sub" x="400" y="142" font-size="12" text-anchor="middle">毎回実行</text>
  <text class="indigo" x="400" y="176" font-size="11" text-anchor="middle">設定：リポジトリ</text>

  <!-- ④ work -->
  <rect x="488" y="40" width="136" height="150" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.6"/>
  <circle cx="512" cy="66" r="12" fill="#6b7280"/>
  <text class="num" x="512" y="71" font-size="14" text-anchor="middle">4</text>
  <text class="box" x="530" y="64" font-size="13">Claude が</text>
  <text class="box" x="530" y="80" font-size="13">作業する</text>
  <text class="sub" x="556" y="106" font-size="12" text-anchor="middle">編集・テスト</text>
  <text class="sub" x="556" y="124" font-size="12" text-anchor="middle">DB・Docker の起動も</text>
  <text class="sub" x="556" y="142" font-size="12" text-anchor="middle">ここで頼む</text>

  <!-- ⑤ push -->
  <rect x="644" y="40" width="136" height="150" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
  <circle cx="668" cy="66" r="12" fill="#059669"/>
  <text class="num" x="668" y="71" font-size="14" text-anchor="middle">5</text>
  <text class="good" x="686" y="64" font-size="13">commit・</text>
  <text class="good" x="686" y="80" font-size="13">push</text>
  <text class="sub" x="712" y="106" font-size="12" text-anchor="middle">成果はブランチと</text>
  <text class="sub" x="712" y="124" font-size="12" text-anchor="middle">PR として残す</text>
  <text class="sub" x="712" y="142" font-size="12" text-anchor="middle">（こまめに）</text>

  <!-- forward arrows -->
  <line x1="156" y1="115" x2="170" y2="115" stroke="#4f46e5" stroke-width="2" marker-end="url(#sl-arrow)"/>
  <line x1="312" y1="115" x2="326" y2="115" stroke="#4f46e5" stroke-width="2" marker-end="url(#sl-arrow)"/>
  <line x1="468" y1="115" x2="482" y2="115" stroke="#4f46e5" stroke-width="2" marker-end="url(#sl-arrow)"/>
  <line x1="624" y1="115" x2="638" y2="115" stroke="#4f46e5" stroke-width="2" marker-end="url(#sl-arrow)"/>

  <!-- skip note for ② -->
  <text class="amber" x="244" y="24" font-size="12" text-anchor="middle">キャッシュがあればスキップ</text>

  <!-- idle -> reclaim -->
  <line x1="556" y1="190" x2="556" y2="236" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#sl-arrow-gray)"/>
  <text class="sub" x="566" y="218" font-size="12">アイドルが続く</text>
  <rect x="476" y="240" width="160" height="52" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text class="gray" x="556" y="264" font-size="14" text-anchor="middle">VM を回収</text>
  <text class="sub" x="556" y="283" font-size="12" text-anchor="middle">環境失効</text>

  <!-- reclaim -> resume -->
  <line x1="476" y1="266" x2="428" y2="266" stroke="#6b7280" stroke-width="1.8" marker-end="url(#sl-arrow-gray)"/>
  <rect x="264" y="240" width="160" height="52" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text class="gray" x="344" y="264" font-size="14" text-anchor="middle">再開する</text>
  <text class="sub" x="344" y="283" font-size="12" text-anchor="middle">claude.ai/code から</text>

  <!-- resume -> back to ① -->
  <path d="M264,266 L88,266 L88,196" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#sl-arrow-gray)"/>
  <text class="sub" x="176" y="256" font-size="12" text-anchor="middle">新しい VM で ① から</text>

  <!-- restored / lost -->
  <rect x="20" y="320" width="370" height="96" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text class="good" x="40" y="348" font-size="14">再開で戻るもの</text>
  <text class="sub" x="40" y="374" font-size="13">・会話履歴</text>
  <text class="sub" x="40" y="398" font-size="13">・push 済みの変更（リモートにあるもの）</text>

  <rect x="410" y="320" width="370" height="96" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text class="bad" x="430" y="348" font-size="14">戻らないもの</text>
  <text class="sub" x="430" y="374" font-size="13">・未 push のファイル</text>
  <text class="sub" x="430" y="398" font-size="13">・起動中のプロセス・バックグラウンド処理</text>
</svg>
