<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="title-roundtrip">
  <title id="title-roundtrip">ローカルとクラウドの往復：claude --cloud で新しいクラウドセッションを作成、claude -p と --cloud で実行中のセッションにメッセージを追送、claude --teleport でクラウドのセッションをローカルに引き戻す。CLI から実行中のローカルセッションをクラウドへ移すことはできない</title>
  <defs>
    <marker id="rt-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#4f46e5" stroke-width="1.5"/>
    </marker>
    <marker id="rt-arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#059669" stroke-width="1.5"/>
    </marker>
  </defs>
  <style>
    .head { font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; font-weight: 700; fill: #312e81; }
    .box { font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; font-weight: 700; fill: #1f2937; }
    .sub { font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; fill: #4b5563; }
    .bad { font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; font-weight: 700; fill: #991b1b; }
    .cmd { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-weight: 700; fill: #3730a3; }
    .cmdg { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-weight: 700; fill: #065f46; }
  </style>

  <rect x="0" y="0" width="800" height="400" fill="#ffffff"/>

  <!-- terminal -->
  <rect x="20" y="30" width="190" height="290" rx="14" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.8"/>
  <rect x="20" y="30" width="190" height="34" rx="14" fill="#374151"/>
  <rect x="20" y="50" width="190" height="14" fill="#374151"/>
  <circle cx="40" cy="47" r="5" fill="#f87171"/>
  <circle cx="56" cy="47" r="5" fill="#fbbf24"/>
  <circle cx="72" cy="47" r="5" fill="#34d399"/>
  <text class="head" x="115" y="110" font-size="17" text-anchor="middle">ターミナル</text>
  <text class="sub" x="115" y="134" font-size="13" text-anchor="middle">ローカル CLI</text>
  <text class="sub" x="115" y="178" font-size="12" text-anchor="middle">自分の PC の</text>
  <text class="sub" x="115" y="196" font-size="12" text-anchor="middle">作業ディレクトリ</text>
  <text class="sub" x="115" y="236" font-size="12" text-anchor="middle">引き戻した後の作業は</text>
  <text class="sub" x="115" y="254" font-size="12" text-anchor="middle">ローカルに残る</text>

  <!-- cloud -->
  <rect x="590" y="30" width="190" height="290" rx="14" fill="#f5f7ff" stroke="#6366f1" stroke-width="1.8"/>
  <text class="head" x="685" y="60" font-size="17" text-anchor="middle">クラウド</text>

  <rect x="608" y="80" width="154" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text class="box" x="685" y="110" font-size="14" text-anchor="middle">新しいセッション</text>
  <text class="sub" x="685" y="132" font-size="12" text-anchor="middle">リモートをクローン</text>

  <rect x="608" y="180" width="154" height="120" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text class="box" x="685" y="210" font-size="14" text-anchor="middle">実行中のセッション</text>
  <text class="sub" x="685" y="232" font-size="12" text-anchor="middle">ブランチ＋会話履歴</text>

  <!-- 1. cloud: new session -->
  <line x1="210" y1="115" x2="602" y2="115" stroke="#4f46e5" stroke-width="2.2" marker-end="url(#rt-arrow)"/>
  <text class="cmd" x="400" y="102" font-size="14" text-anchor="middle">claude --cloud "..."</text>
  <text class="sub" x="400" y="136" font-size="12" text-anchor="middle">新規作成（先に push しておく）</text>

  <!-- 2. cloud: follow-up message -->
  <line x1="210" y1="215" x2="602" y2="215" stroke="#4f46e5" stroke-width="2.2" marker-end="url(#rt-arrow)"/>
  <text class="cmd" x="400" y="202" font-size="14" text-anchor="middle">claude -p "..." --cloud &lt;id&gt;</text>
  <text class="sub" x="400" y="236" font-size="12" text-anchor="middle">メッセージを 1 件追送して終了</text>

  <!-- 3. teleport: pull back -->
  <line x1="608" y1="280" x2="216" y2="280" stroke="#059669" stroke-width="2.2" marker-end="url(#rt-arrow-green)"/>
  <text class="cmdg" x="400" y="267" font-size="14" text-anchor="middle">claude --teleport [id]</text>
  <text class="sub" x="400" y="301" font-size="12" text-anchor="middle">引き戻し（作業ディレクトリは clean に）</text>

  <!-- one-way note -->
  <rect x="20" y="340" width="760" height="44" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text class="bad" x="400" y="368" font-size="13" text-anchor="middle">✕ CLI からは一方通行：実行中のローカルセッションをそのままクラウドへ移すことはできない</text>
</svg>
