<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-labelledby="title-local-vs-cloud">
  <title id="title-local-vs-cloud">ローカルとクラウドの比較：ローカルではエージェント・作業ファイル・秘密情報が同じ PC に同居する。クラウドでは隔離 VM に秘密情報を置かず、プロキシが許可リストで通信を制限し、トークンや API キーをサーバ側で付与する</title>
  <defs>
    <marker id="lvc-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#4f46e5" stroke-width="1.5"/>
    </marker>
    <marker id="lvc-arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#dc2626" stroke-width="1.5"/>
    </marker>
    <marker id="lvc-arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#059669" stroke-width="1.5"/>
    </marker>
  </defs>
  <style>
    .head { font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; font-weight: 700; fill: #312e81; }
    .box { font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; font-weight: 700; fill: #1f2937; }
    .sub { font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; fill: #4b5563; }
    .bad { font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; font-weight: 700; fill: #991b1b; }
    .good { font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; font-weight: 700; fill: #065f46; }
  </style>

  <rect x="0" y="0" width="800" height="470" fill="#ffffff"/>

  <!-- ===== Left: local ===== -->
  <text class="head" x="195" y="34" font-size="18" text-anchor="middle">ローカル：すべてが同居</text>

  <rect x="30" y="56" width="330" height="236" rx="14" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.8"/>
  <text class="box" x="50" y="84" font-size="15">自分の PC</text>

  <rect x="50" y="100" width="130" height="52" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text class="box" x="115" y="132" font-size="14" text-anchor="middle">エージェント</text>

  <rect x="210" y="100" width="130" height="52" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text class="box" x="275" y="132" font-size="14" text-anchor="middle">作業ファイル</text>

  <rect x="130" y="200" width="130" height="64" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text class="bad" x="195" y="228" font-size="14" text-anchor="middle">.env・秘密鍵</text>
  <text class="sub" x="195" y="250" font-size="12" text-anchor="middle">トークン・API キー</text>

  <!-- agent can read secrets -->
  <line x1="115" y1="152" x2="160" y2="196" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#lvc-arrow-red)"/>
  <text class="bad" x="62" y="186" font-size="12">読める</text>

  <!-- outbound -->
  <line x1="195" y1="292" x2="195" y2="336" stroke="#dc2626" stroke-width="1.8" marker-end="url(#lvc-arrow-red)"/>
  <rect x="95" y="340" width="200" height="48" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text class="box" x="195" y="362" font-size="14" text-anchor="middle">インターネット</text>
  <text class="sub" x="195" y="380" font-size="12" text-anchor="middle">通信範囲は PC まかせ</text>

  <text class="sub" x="195" y="420" font-size="13" text-anchor="middle">PC を閉じると止まる・基本は 1 つずつ</text>
  <text class="bad" x="195" y="444" font-size="13" text-anchor="middle">AI が読める場所に secrets がある</text>

  <!-- divider -->
  <line x1="400" y1="20" x2="400" y2="450" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- ===== Right: cloud ===== -->
  <text class="head" x="600" y="34" font-size="18" text-anchor="middle">クラウド：役割ごとに分離</text>

  <rect x="430" y="56" width="340" height="122" rx="14" fill="#f5f7ff" stroke="#6366f1" stroke-width="1.8"/>
  <text class="box" x="450" y="84" font-size="15">隔離 VM</text>
  <text class="sub" x="750" y="84" font-size="12" text-anchor="end">セッションごとに用意</text>
  <rect x="450" y="98" width="120" height="44" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text class="box" x="510" y="126" font-size="14" text-anchor="middle">エージェント</text>
  <rect x="585" y="98" width="120" height="44" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text class="box" x="645" y="126" font-size="14" text-anchor="middle">作業ファイル</text>
  <text class="good" x="600" y="166" font-size="12" text-anchor="middle">秘密情報は置かない</text>

  <!-- VM -> proxy -->
  <line x1="545" y1="178" x2="545" y2="206" stroke="#4f46e5" stroke-width="2" marker-end="url(#lvc-arrow)"/>
  <text class="sub" x="555" y="197" font-size="12">外部への通信はすべて経由</text>

  <!-- proxy -->
  <rect x="430" y="210" width="230" height="60" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
  <text class="box" x="545" y="235" font-size="15" text-anchor="middle">プロキシ</text>
  <text class="sub" x="545" y="257" font-size="12" text-anchor="middle">許可リストで通信先を制限</text>

  <!-- credentials -->
  <rect x="680" y="210" width="90" height="60" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text class="good" x="725" y="235" font-size="13" text-anchor="middle">資格情報</text>
  <text class="sub" x="725" y="255" font-size="11" text-anchor="middle">サーバ側に保管</text>
  <line x1="680" y1="240" x2="666" y2="240" stroke="#059669" stroke-width="1.8" marker-end="url(#lvc-arrow-green)"/>

  <!-- proxy -> destinations -->
  <line x1="480" y1="270" x2="480" y2="308" stroke="#4f46e5" stroke-width="2" marker-end="url(#lvc-arrow)"/>
  <line x1="605" y1="270" x2="605" y2="308" stroke="#4f46e5" stroke-width="2" marker-end="url(#lvc-arrow)"/>
  <line x1="650" y1="270" x2="718" y2="308" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#lvc-arrow-red)"/>
  <text class="good" x="543" y="294" font-size="11" text-anchor="middle">トークンを付与</text>

  <rect x="430" y="312" width="100" height="60" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text class="box" x="480" y="338" font-size="14" text-anchor="middle">GitHub</text>
  <text class="sub" x="480" y="358" font-size="12" text-anchor="middle">クローン・PR</text>

  <rect x="540" y="312" width="130" height="60" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text class="box" x="605" y="338" font-size="14" text-anchor="middle">許可済みホスト</text>
  <text class="sub" x="605" y="358" font-size="12" text-anchor="middle">レジストリ等</text>

  <rect x="680" y="312" width="90" height="60" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text class="bad" x="725" y="338" font-size="14" text-anchor="middle">許可外</text>
  <text class="bad" x="725" y="358" font-size="12" text-anchor="middle">403 で拒否</text>

  <text class="sub" x="600" y="420" font-size="13" text-anchor="middle">PC を閉じても継続・複数セッションを同時実行</text>
  <text class="good" x="600" y="444" font-size="13" text-anchor="middle">AI が読める場所に secrets が無い</text>
</svg>
