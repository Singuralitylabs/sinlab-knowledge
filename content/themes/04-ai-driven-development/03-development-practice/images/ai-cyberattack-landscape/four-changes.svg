<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-labelledby="title-four-changes">
  <title id="title-four-changes">AIで変わったサイバー攻撃の4つの変化：攻撃の実行をAIが担う、パッチ公開から攻撃までが速くなった、騙しの質と量が上がった、開発者とAIツール自体が狙われる。効く対策の多くは基本の対策</title>
  <style>
    .t { font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; }
    .h { font-weight: 700; fill: #312e81; font-size: 22px; }
    .n { font-weight: 700; fill: #ffffff; font-size: 15px; }
    .b { font-weight: 700; fill: #1f2937; font-size: 18px; }
    .s { fill: #4b5563; font-size: 14px; }
    .f { font-weight: 700; fill: #065f46; font-size: 16px; }
  </style>
  <rect width="800" height="440" fill="#ffffff"/>
  <text x="400" y="42" text-anchor="middle" class="t h">AIでサイバー攻撃の何が変わったか — 4つの変化</text>

  <g>
    <rect x="30" y="70" width="360" height="130" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <rect x="50" y="88" width="64" height="26" rx="13" fill="#4f46e5"/>
    <text x="82" y="106" text-anchor="middle" class="t n">変化1</text>
    <text x="50" y="141" class="t b">攻撃の「実行」をAIが担う</text>
    <text x="50" y="166" class="t s">偵察・脆弱性探し・侵入の作業をAIが代行</text>
    <text x="50" y="186" class="t s">（自動化される範囲が広がりつつある）</text>
  </g>
  <g>
    <rect x="410" y="70" width="360" height="130" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <rect x="430" y="88" width="64" height="26" rx="13" fill="#4f46e5"/>
    <text x="462" y="106" text-anchor="middle" class="t n">変化2</text>
    <text x="430" y="141" class="t b">パッチ公開から攻撃までが速くなった</text>
    <text x="430" y="166" class="t s">パッチの差分をAIで解析して攻撃を組み立てる</text>
    <text x="430" y="186" class="t s">→ パッチ公開は攻撃のスタートの合図</text>
  </g>
  <g>
    <rect x="30" y="220" width="360" height="130" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <rect x="50" y="238" width="64" height="26" rx="13" fill="#4f46e5"/>
    <text x="82" y="256" text-anchor="middle" class="t n">変化3</text>
    <text x="50" y="291" class="t b">騙しの質と量が上がった</text>
    <text x="50" y="316" class="t s">自然な日本語のフィッシングを大量に作れる</text>
    <text x="50" y="336" class="t s">→「文面が変だから怪しい」は通じない</text>
  </g>
  <g>
    <rect x="410" y="220" width="360" height="130" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <rect x="430" y="238" width="64" height="26" rx="13" fill="#4f46e5"/>
    <text x="462" y="256" text-anchor="middle" class="t n">変化4</text>
    <text x="430" y="291" class="t b">開発者とAIツール自体が狙われる</text>
    <text x="430" y="316" class="t s">依存パッケージの汚染、AIのAPIキーの窃取</text>
    <text x="430" y="336" class="t s">→「小さいから狙われない」は当てはまらない</text>
  </g>

  <rect x="30" y="372" width="740" height="50" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="400" y="403" text-anchor="middle" class="t f">効く対策の多くは基本の対策：更新を速く回す ・ 認証を強くする ・ 秘密情報と権限を絞る</text>
</svg>
