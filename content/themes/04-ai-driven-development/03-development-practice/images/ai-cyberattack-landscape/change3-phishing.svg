<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-labelledby="title-c3">
  <title id="title-c3">変化3のイメージ：以前のフィッシングメールは日本語が不自然で見抜けることが多かった。今はAIで自然な日本語の文面を大量に作れるため見抜きにくい。見た目で判断するのではなく、パスキーや多要素認証で偽サイトに入力しても突破されにくくする</title>
  <defs>
    <marker id="c3a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#6b7280" stroke-width="1.5"/>
    </marker>
  </defs>
  <style>
    .t { font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; }
    .h { font-weight: 700; fill: #312e81; font-size: 22px; }
    .lab { font-weight: 700; fill: #374151; font-size: 16px; }
    .b { font-weight: 700; fill: #1f2937; font-size: 16px; }
    .s { fill: #4b5563; font-size: 13px; }
    .w { font-weight: 700; fill: #ffffff; font-size: 14px; }
    .ok { font-weight: 700; fill: #065f46; font-size: 15px; }
    .ng { font-weight: 700; fill: #9a3412; font-size: 15px; }
  </style>
  <rect width="800" height="330" fill="#ffffff"/>
  <text x="400" y="38" text-anchor="middle" class="t h">変化3: 騙しの質と量が上がった</text>

  <rect x="30" y="62" width="350" height="160" rx="12" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <rect x="50" y="74" width="70" height="26" rx="13" fill="#9ca3af"/>
  <text x="85" y="92" text-anchor="middle" class="t w">以前</text>
  <rect x="50" y="112" width="310" height="60" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="62" y="136" class="t s">件名: お客様のアカウントがロックしました</text>
  <text x="62" y="158" class="t s">至急に下記をクリックしてくださいませ</text>
  <text x="205" y="202" text-anchor="middle" class="t ok">日本語が不自然 → 見抜きやすい</text>

  <rect x="420" y="62" width="350" height="160" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <rect x="440" y="74" width="70" height="26" rx="13" fill="#4f46e5"/>
  <text x="475" y="92" text-anchor="middle" class="t w">今</text>
  <rect x="440" y="112" width="310" height="60" rx="6" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="452" y="136" class="t s">件名: 【重要】ログイン確認のお願い</text>
  <text x="452" y="158" class="t s">いつもご利用ありがとうございます。…</text>
  <text x="595" y="202" text-anchor="middle" class="t ng">自然な文面を大量に作れる → 見抜きにくい</text>

  <rect x="30" y="246" width="740" height="56" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="400" y="280" text-anchor="middle" class="t ok">見た目で見分けるより、パスキーや多要素認証で「入力しても突破されにくい」状態にする</text>
</svg>
