<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" role="img" aria-labelledby="title-c2">
  <title id="title-c2">変化2のイメージ：パッチ公開から攻撃開始までの時間。以前は人手で差分を解析するため時間がかかったが、今はAIで自動解析するため短くなった。利用者が更新するまでの間が狙われる期間になる</title>
  <defs>
    <marker id="c2a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#6b7280" stroke-width="1.5"/>
    </marker>
  </defs>
  <style>
    .t { font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; }
    .h { font-weight: 700; fill: #312e81; font-size: 22px; }
    .lab { font-weight: 700; fill: #374151; font-size: 16px; }
    .b { font-weight: 700; fill: #1f2937; font-size: 16px; }
    .s { fill: #4b5563; font-size: 13px; }
    .w { font-weight: 700; fill: #ffffff; font-size: 14px; }
    .ok { font-weight: 700; fill: #065f46; font-size: 15px; }
    .ng { font-weight: 700; fill: #9a3412; font-size: 15px; }
  </style>
  <rect width="800" height="320" fill="#ffffff"/>
  <text x="400" y="38" text-anchor="middle" class="t h">変化2: パッチ公開から攻撃までが速くなった</text>

  <line x1="150" y1="70" x2="150" y2="250" stroke="#4f46e5" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="150" y="64" text-anchor="middle" class="t lab">パッチ公開</text>

  <text x="20" y="114" class="t lab">以前</text>
  <rect x="150" y="94" width="470" height="32" rx="6" fill="#e5e7eb"/>
  <text x="385" y="115" text-anchor="middle" class="t s">人手で差分を解析して攻撃を準備（時間がかかる）</text>
  <rect x="620" y="94" width="150" height="32" rx="6" fill="#f97316"/>
  <text x="695" y="115" text-anchor="middle" class="t w">攻撃開始</text>

  <text x="20" y="174" class="t lab">今</text>
  <rect x="150" y="154" width="170" height="32" rx="6" fill="#c7d2fe"/>
  <text x="235" y="175" text-anchor="middle" class="t s">AIで自動解析</text>
  <rect x="320" y="154" width="150" height="32" rx="6" fill="#f97316"/>
  <text x="395" y="175" text-anchor="middle" class="t w">攻撃開始</text>
  <line x1="470" y1="170" x2="610" y2="170" stroke="#6b7280" stroke-width="2" marker-end="url(#c2a)"/>
  <text x="540" y="160" text-anchor="middle" class="t s">早まった分</text>

  <rect x="150" y="210" width="620" height="40" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
  <text x="460" y="236" text-anchor="middle" class="ng t">自分が更新するまでの間 ＝ 狙われる期間。更新が遅いほど危ない</text>

  <text x="400" y="292" text-anchor="middle" class="t s">例: PaperCut の脆弱性では、公表から 1 日以内に研究者が LLM で攻撃コードを再現、4 日後に広範な攻撃（GTIG, 2026-11）</text>
</svg>
