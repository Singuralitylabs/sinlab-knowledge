<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="'Hiragino Sans','Noto Sans JP','Helvetica Neue',Arial,sans-serif" role="img" aria-label="CSSの特定性(詳細度)の図。(idの数, クラス等の数, 要素の数)の3つの組でセレクタの強さを比較する">
  <rect width="600" height="360" fill="#ffffff"/>
  <text x="300" y="34" font-size="17" fill="#111827" font-weight="bold" text-anchor="middle">特定性（詳細度）= ( id , クラス等 , 要素 )</text>
  <text x="300" y="58" font-size="13" fill="#6b7280" text-anchor="middle">左の桁ほど強い。数値が大きいセレクタのスタイルが優先される。</text>

  <!-- header row -->
  <g font-size="13" fill="#374151" text-anchor="middle" font-weight="bold">
    <text x="200" y="96">id</text><text x="280" y="96">クラス等</text><text x="360" y="96">要素</text>
  </g>

  <!-- rows -->
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#111827">
    <text x="40" y="135">h1</text>
    <text x="40" y="185">.title</text>
    <text x="40" y="235">#main</text>
    <text x="40" y="285">nav .item a</text>
  </g>

  <!-- digit boxes -->
  <g text-anchor="middle" font-size="15" font-weight="bold">
    <!-- h1 -> 0,0,1 -->
    <rect x="180" y="118" width="40" height="28" rx="4" fill="#f3f4f6" stroke="#9ca3af"/><text x="200" y="138" fill="#6b7280">0</text>
    <rect x="260" y="118" width="40" height="28" rx="4" fill="#f3f4f6" stroke="#9ca3af"/><text x="280" y="138" fill="#6b7280">0</text>
    <rect x="340" y="118" width="40" height="28" rx="4" fill="#dbeafe" stroke="#2563eb"/><text x="360" y="138" fill="#1d4ed8">1</text>
    <!-- .title -> 0,1,0 -->
    <rect x="180" y="168" width="40" height="28" rx="4" fill="#f3f4f6" stroke="#9ca3af"/><text x="200" y="188" fill="#6b7280">0</text>
    <rect x="260" y="168" width="40" height="28" rx="4" fill="#dcfce7" stroke="#16a34a"/><text x="280" y="188" fill="#15803d">1</text>
    <rect x="340" y="168" width="40" height="28" rx="4" fill="#f3f4f6" stroke="#9ca3af"/><text x="360" y="188" fill="#6b7280">0</text>
    <!-- #main -> 1,0,0 -->
    <rect x="180" y="218" width="40" height="28" rx="4" fill="#fee2e2" stroke="#dc2626"/><text x="200" y="238" fill="#b91c1c">1</text>
    <rect x="260" y="218" width="40" height="28" rx="4" fill="#f3f4f6" stroke="#9ca3af"/><text x="280" y="238" fill="#6b7280">0</text>
    <rect x="340" y="218" width="40" height="28" rx="4" fill="#f3f4f6" stroke="#9ca3af"/><text x="360" y="238" fill="#6b7280">0</text>
    <!-- nav .item a -> 0,1,2 -->
    <rect x="180" y="268" width="40" height="28" rx="4" fill="#f3f4f6" stroke="#9ca3af"/><text x="200" y="288" fill="#6b7280">0</text>
    <rect x="260" y="268" width="40" height="28" rx="4" fill="#dcfce7" stroke="#16a34a"/><text x="280" y="288" fill="#15803d">1</text>
    <rect x="340" y="268" width="40" height="28" rx="4" fill="#dbeafe" stroke="#2563eb"/><text x="360" y="288" fill="#1d4ed8">2</text>
  </g>

  <!-- strength note -->
  <text x="470" y="238" font-size="14" fill="#b91c1c" font-weight="bold">#main が最強</text>
  <text x="300" y="335" font-size="13" fill="#6b7280" text-anchor="middle">同じ特定性なら、後に書いたルールが勝つ。!important は最終手段。</text>
</svg>
